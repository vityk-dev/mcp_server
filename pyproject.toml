[project]
name = "reposense-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "fastmcp<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.8",
  "pre-commit>=3.6",
  "hypothesis>=6.100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
